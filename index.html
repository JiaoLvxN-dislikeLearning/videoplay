<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自定义视频播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }
        .video-container {
            position: relative;
            max-width: 100vw;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .custom-video {
            width: 100%;
            max-width: 100%;
            display: block;
        }
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .video-container:hover .controls,
        .video-container:focus-within .controls {
            opacity: 1;
        }
        .controls button {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 4px;
            transition: background 0.2s;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            height: 4px;
            border-radius: 2px;
            outline: none;
            transition: background 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
            cursor: pointer;
            border: none;
        }
        .progress-bar {
            flex: 1;
        }
        .volume-bar {
            width: 80px;
        }
        .time-display {
            font-size: 0.9rem;
            font-family: monospace;
            min-width: 100px;
            text-align: center;
        }
        .video-container:fullscreen .controls {
            bottom: 20px;
            left: 20px;
            right: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="myVideo" class="custom-video" src="video.mp4" poster="poster.webp" autoplay playsinline>
            <source src="your-video.webm" type="video/webm">
            <p>您的浏览器不支持 HTML5 视频播放</p>
        </video>
        <div class="controls">
            <button id="playPauseBtn">▶</button>
            <input type="range" id="progressBar" class="progress-bar" value="0" min="0" step="0.01" />
            <span class="time-display">
                <span id="currentTime">00:00</span> / <span id="totalTime">00:00</span>
            </span>
            <input type="range" id="volumeBar" class="volume-bar" value="1" min="0" max="1" step="0.01" />
            <button id="fullscreenBtn">⛶</button>
        </div>
    </div>
    <script>
        const video = document.getElementById('myVideo');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const currentTimeDisplay = document.getElementById('currentTime');
        const totalTimeDisplay = document.getElementById('totalTime');
        const volumeBar = document.getElementById('volumeBar');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const container = document.querySelector('.video-container');

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function togglePlay() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', togglePlay);

        video.addEventListener('play', () => {
            playPauseBtn.textContent = '⏸';
        });
        video.addEventListener('pause', () => {
            playPauseBtn.textContent = '▶';
        });

        video.addEventListener('timeupdate', () => {
            const progress = (video.currentTime / video.duration) * 100;
            progressBar.value = progress;
            currentTimeDisplay.textContent = formatTime(video.currentTime);
        });

        video.addEventListener('loadedmetadata', () => {
            totalTimeDisplay.textContent = formatTime(video.duration);
        });

        progressBar.addEventListener('input', () => {
            const seekTime = (progressBar.value / 100) * video.duration;
            video.currentTime = seekTime;
        });

        volumeBar.addEventListener('input', () => {
            video.volume = volumeBar.value;
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    alert('无法进入全屏模式：' + err.message);
                });
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.target === document.body && e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });
    </script>
</body>
</html>
